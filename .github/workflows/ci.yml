name: CI - Pruebas y Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: tecnorepuestos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    # 1. Descargar el código del repositorio
    - uses: actions/checkout@v3
    
    # 2. Configurar Node.js para Backend
    - name: Setup Node.js ${{ matrix.node-version }} - Backend
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'
    
    # 3. Instalar dependencias (Backend)
    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm install
    
    # 4. Configurar variables de entorno para tests
    - name: Create .env file for tests
      working-directory: ./backend
      run: |
        echo "DB_HOST=localhost" > .env
        echo "DB_PORT=5432" >> .env
        echo "DB_USER=postgres" >> .env
        echo "DB_PASSWORD=postgres" >> .env
        echo "DB_NAME=tecnorepuestos_test" >> .env
        echo "NODE_ENV=test" >> .env
        echo "JWT_SECRET=test_secret_key" >> .env
        echo "API_PORT=3000" >> .env
    
    # 5. Ejecutar pruebas unitarias
    - name: Run Unit Tests
      working-directory: ./backend
      run: npm run test:unit
      continue-on-error: true
    
    # 6. Ejecutar pruebas de integración
    - name: Run Integration Tests
      working-directory: ./backend
      run: npm run test:integration
      continue-on-error: true
    
    # 7. Generar reporte de cobertura
    - name: Generate Coverage Report
      working-directory: ./backend
      run: npm run test:coverage
      continue-on-error: true
    
    # 8. Linting Backend 
    - name: Run Backend Linter
      working-directory: ./backend
      run: npm run lint
      continue-on-error: true
    
    # 9. Configurar Node.js para Frontend
    - name: Setup Node.js ${{ matrix.node-version }} - Frontend
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
    
    # 10. Instalar dependencias (Frontend)
    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install
    
    # 11. Build del Frontend
    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build
      continue-on-error: true
    
    # 12. Linting Frontend 
    - name: Run Frontend Linter
      working-directory: ./frontend
      run: npm run lint
      continue-on-error: true

  # Job para pruebas E2E 
  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
    - uses: actions/checkout@v3
    
    # Configurar Node.js para Backend
    - name: Setup Node.js - Backend
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'
    
    # Backend
    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm install
    
    - name: Create .env for E2E
      working-directory: ./backend
      run: |
        echo "DB_HOST=localhost" > .env
        echo "DB_PORT=5432" >> .env
        echo "DB_USER=postgres" >> .env
        echo "DB_PASSWORD=postgres" >> .env
        echo "DB_NAME=tecnorepuestos_test" >> .env
        echo "NODE_ENV=test" >> .env
        echo "JWT_SECRET=test_secret_key" >> .env
        echo "API_PORT=3000" >> .env
    
    - name: Start Backend Server
      working-directory: ./backend
      run: npm start &
      env:
        NODE_ENV: test
    
    - name: Wait for Backend
      run: sleep 5
    
    # Configurar Node.js para Frontend
    - name: Setup Node.js - Frontend
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
    
    # Frontend
    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install
    
    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build
      continue-on-error: true
    
    - name: Run E2E Tests
      working-directory: ./frontend
      run: npm run test:e2e
      continue-on-error: true

  # Job para notificaciones 
  notify:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: always()
    
    steps:
    - name: Check Test Results
      run: |
        if [ "${{ needs.test.result }}" == "success" ]; then
          echo "Todas las pruebas pasaron correctamente"
          exit 0
        else
          echo "Algunas pruebas tuvieron problemas"
          exit 0
        fi
      continue-on-error: true